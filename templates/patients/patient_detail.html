<!DOCTYPE html>
<html>
<head>
    <title>Patient Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2>{{ patient.full_name }}</h2>

    <div class="card p-3">
        <p><strong>DOB:</strong> {{ patient.date_of_birth }}</p>
        <p><strong>Gender:</strong> {{ patient.gender }}</p>
        <p><strong>Phone:</strong> {{ patient.phone }}</p>
        <p><strong>Email:</strong> {{ patient.email }}</p>
        <p><strong>Insurance:</strong> {{ patient.insurance_id }}</p>
    </div>

    <br>
    <a href="{% url 'patient_edit' patient.pk %}" class="btn btn-warning">Edit</a>
    <a href="{% url 'patient_list' %}" class="btn btn-secondary">Back</a>

</div>

</body>
</html>
