<!DOCTYPE html>
<html>
<head>
    <title>Patients</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#f4f6f9; }
        .card { border-radius:12px; }
        .header { display:flex; justify-content:space-between; align-items:center; }
    </style>
</head>

<body>

<div class="container mt-4">

    <!-- Header -->
    <div class="header mb-3">
        <h2>Patient Management</h2>
        <a href="{% url 'patient_create' %}" class="btn btn-primary">+ Add Patient</a>
    </div>

    <!-- Search -->
    <form method="GET" class="mb-3">
        <input type="text" name="q" value="{{ query }}" placeholder="Search patient..."
               class="form-control">
    </form>

    <!-- Table -->
    <div class="card p-3">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>DOB</th>
                    <th>Gender</th>
                    <th>Phone</th>
                    <th>Insurance</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                {% for patient in patients %}
                <tr>
                    <td>{{ patient.full_name }}</td>
                    <td>{{ patient.date_of_birth }}</td>
                    <td>{{ patient.gender }}</td>
                    <td>{{ patient.phone }}</td>
                    <td>{{ patient.insurance_id }}</td>
                    <td>
                        <a href="{% url 'patient_detail' patient.pk %}" class="btn btn-sm btn-info">View</a>
                        <a href="{% url 'patient_edit' patient.pk %}" class="btn btn-sm btn-warning">Edit</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="6" class="text-center">No patients found</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
